{% extends 'base.html' %}

{% block content %}
    <h2>Create your profile!</h2>
  
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
    
        <button type="submit">Create</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Log in here</a>.</p>
  
{% endblock %}
